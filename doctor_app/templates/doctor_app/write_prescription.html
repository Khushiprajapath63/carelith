<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Write Prescription</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 16px; padding: 2rem; width: 100%; max-width: 560px; }
        h2 { font-size: 1.2rem; margin-bottom: 0.3rem; color: #fff; }
        .sub { color: #a0a0c0; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.8rem; color: #a0a0c0; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        textarea, input { width: 100%; background: #0f0f1a; border: 1px solid #2a2a4a; color: #e0e0e0; padding: 0.7rem 0.9rem; border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
        textarea { resize: vertical; min-height: 100px; }
        textarea:focus, input:focus { outline: none; border-color: #00d4aa; }
        .btn { width: 100%; padding: 0.75rem; background: #00d4aa; color: #0f0f1a; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
        .btn:hover { background: #00b894; }
        .back { display: block; text-align: center; margin-top: 1rem; color: #a0a0c0; font-size: 0.85rem; text-decoration: none; }
        .back:hover { color: #00d4aa; }
        {% if messages %}
        .msg { padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; background: #e74c3c22; color: #e74c3c; border: 1px solid #e74c3c44; }
        {% endif %}
    </style>
</head>
<body>
<div class="card">
    <h2>✍️ Write Prescription</h2>
    <p class="sub">Patient: <strong style="color:#00d4aa;">{{ patient.user.username }}</strong></p>

    {% if messages %}
    {% for message in messages %}
    <div class="msg">{{ message }}</div>
    {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Medicines & Dosage</label>
            <textarea name="medicines" placeholder="e.g. Paracetamol 500mg - twice daily&#10;Amoxicillin 250mg - thrice daily" required></textarea>
        </div>
        <div class="form-group">
            <label>Additional Notes (optional)</label>
            <textarea name="notes" placeholder="e.g. Take after meals. Avoid alcohol." style="min-height:70px;"></textarea>
        </div>
        <button type="submit" class="btn">Save Prescription</button>
    </form>
    <a href="{% url 'doctor_app:doctor_dashboard' %}" class="back">← Back to Dashboard</a>
</div>
</body>
</html>
